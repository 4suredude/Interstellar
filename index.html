<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Interstellar — top-down space combat</title>
<!-- installable app: "Add to Home Screen" launches chrome-less fullscreen —
     the only fullscreen path on iPhone Safari, and the nicest one on Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interstellar">
<meta name="theme-color" content="#04060d">
<link rel="manifest" href='data:application/manifest+json,{"name":"Interstellar","short_name":"Interstellar","display":"fullscreen","orientation":"any","background_color":"%2304060d","theme_color":"%2304060d","start_url":"."}'>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04060d;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  /* 100dvh tracks the REAL visible height on mobile (URL bar collapse);
     plain 100vh would push bottom-anchored touch buttons off screen */
  canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;
    cursor:crosshair;touch-action:none}
  #err{position:fixed;top:12px;left:12px;right:12px;z-index:9;display:none;
    color:#ffb0a8;background:#1c0a0a;border:1px solid #a04438;border-radius:8px;
    padding:14px 18px;font:13px/1.5 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="err"></div>
<script>
// never fail silently: any startup problem is reported on screen
(function () {
  function show(msg) {
    var d = document.getElementById('err');
    d.style.display = 'block';
    d.textContent += (d.textContent ? '\n\n' : 'INTERSTELLAR could not start\n\n') + msg;
  }
  window.__showErr = show;
  window.__scriptFail = function (name) {
    var folder = location.href.replace(/[^\/\\]*$/, '');
    show('Missing file: ' + name + '\n' +
      'This page was opened from:\n  ' + folder + '\n' +
      'but ' + name + ' is not there. You are probably opening an old or\n' +
      'partial copy — open index.html from the full cloned repository\n' +
      '(the folder must contain index.html, sim.js, AND client.js).\n\n' +
      'Bulletproof alternative: in the full game folder run\n' +
      '  node server.js\n' +
      'then open  http://localhost:8666  in any browser.');
  };
  window.onerror = function (msg, src, line) {
    show(msg + '\n  at ' + (src || '?') + ':' + (line || '?') +
      '\n\nIf this mentions unexpected syntax, your browser may be too old — use a current Chrome, Edge, or Firefox.');
  };
  window.addEventListener('load', function () {
    if (!window.SIM || !window.__interstellar) {
      var missing = [];
      if (!window.SIM) missing.push('sim.js');
      if (!window.__interstellar) missing.push('client.js');
      show('Scripts that did not run: ' + missing.join(', ') + '\n' +
        'Opened from: ' + location.href + '\n\n' +
        '- index.html, sim.js, and client.js must all be in the SAME folder\n' +
        '  (clone or download the whole repository, not just one file).\n' +
        '- Easiest path: install Node.js, run  node server.js  in the game\n' +
        '  folder, then open  http://localhost:8666  in your browser.');
    }
  });
})();
</script>
<script src="sim.js" onerror="__scriptFail('sim.js')"></script>
<script src="client.js" onerror="__scriptFail('client.js')"></script>
</body>
</html>

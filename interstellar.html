// never fail silently: any startup problem is reported on screen
(function () {
  function show(msg) {
    var d = document.getElementById('err');
    d.style.display = 'block';
    d.textContent += (d.textContent ? '\n\n' : 'INTERSTELLAR could not start\n\n') + msg;
  }
  window.__showErr = show;
  window.__scriptFail = function (name) {
    var folder = location.href.replace(/[^\/\\]*$/, '');
    show('Missing file: ' + name + '\n' +
      'This page was opened from:\n  ' + folder + '\n' +
      'but ' + name + ' is not there. You are probably opening an old or\n' +
      'partial copy — open index.html from the full cloned repository\n' +
      '(the folder must contain index.html, sim.js, AND client.js).\n\n' +
      'Bulletproof alternative: in the full game folder run\n' +
      '  node server.js\n' +
      'then open  http://localhost:8666  in any browser.');
  };
  window.onerror = function (msg, src, line) {
    show(msg + '\n  at ' + (src || '?') + ':' + (line || '?') +
      '\n\nIf this mentions unexpected syntax, your browser may be too old — use a current Chrome, Edge, or Firefox.');
  };
  window.addEventListener('load', function () {
    if (!window.SIM || !window.__interstellar) {
      var missing = [];
      if (!window.SIM) missing.push('sim.js');
      if (!window.__interstellar) missing.push('client.js');
      show('Scripts that did not run: ' + missing.join(', ') + '\n' +
        'Opened from: ' + location.href + '\n\n' +
        '- index.html, sim.js, and client.js must all be in the SAME folder\n' +
        '  (clone or download the whole repository, not just one file).\n' +
        '- Easiest path: install Node.js, run  node server.js  in the game\n' +
        '  folder, then open  http://localhost:8666  in your browser.');
    }
  });
})();

  // sparse tile field: the world rim is a formula, empty space costs

  function tileSolid(W, tx, ty) {
    if (tx < 2 || ty < 2 || tx >= MAPS - 2 || ty >= MAPS - 2) return true;
    const ch = W.tiles.get(((tx / TCH) | 0) * TCHROW + ((ty / TCH) | 0));
    return ch ? ch[(ty % TCH) * TCH + (tx % TCH)] !== 0 : false;
  }
  function solidAtPx(W, x, y) { return tileSolid(W, (x / TILE) | 0, (y / TILE) | 0); }
  function rectSolid(W, x, y, w, h) {
    const x0 = (x / TILE) | 0, y0 = (y / TILE) | 0;
    const x1 = ((x + w) / TILE) | 0, y1 = ((y + h) / TILE) | 0;
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++)
        if (tileSolid(W, tx, ty)) return true;
    return false;
  }
  function losClear(W, x1, y1, x2, y2) {
    const d = hyp(x2 - x1, y2 - y1), n = Math.max(1, (d / 12) | 0);
    for (let i = 1; i < n; i++) {
      const t = i / n;
      if (solidAtPx(W, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
    }
    return true;
  }

  function genMap(W) {
    const rng = W.rng;
    const rn = n => (rng() * n) | 0;
    const style = W.opts.mapStyle || 'nexus';
    W.tiles = new Map();
    const set = (x, y, v) => {
      if (x < 2 || y < 2 || x >= MAPS - 2 || y >= MAPS - 2) return;
      const k = ((x / TCH) | 0) * TCHROW + ((y / TCH) | 0);
      let ch = W.tiles.get(k);
      if (!ch) {
        if (!v) return;                  // clearing empty space is free
        ch = new Uint8Array(TCH * TCH);
        W.tiles.set(k, ch);
      }
      ch[(y % TCH) * TCH + (x % TCH)] = v;
    };
    const fillRect = (x, y, w, h, v) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, v); };

    // The sector is OPEN SPACE. What structure exists was BUILT — or broke
    // apart out here. The architecture has logic: a citadel at the heart of
    // the sector, a ring of guard stations on the approaches to the core, a
    // few frontier depots deep in the black, asteroid belts where rubble
    // actually belongs, and the odd drifting derelict as a landmark.
    const MC = MAPS / 2;
    const clearings = [
      { x: MC, y: MC, r: 30 },            // arena + its approaches
      { x: MC - 60, y: MC, r: 26 },       // west staging field (blue flank)
      { x: MC + 60, y: MC, r: 26 },       // east staging field (red flank)
      { x: MC, y: MC - 62, r: 20 },       // north field
      { x: MC, y: MC + 62, r: 20 },       // south field
    ];
    const inClearing = (x, y, margin) =>
      clearings.some(cl => hyp(x - cl.x, y - cl.y) < cl.r + (margin || 0));

    const bases = [];
    const nearBase = (x, y, m) => bases.some(b => hyp(x - b.x, y - b.y) < b.r + (m || 0));
    // wallRect: rectangle wall with centered gates on every side — the
    // symmetric, gated look of something DESIGNED
    const wallRect = (x0, y0, x1, y1, g) => {
      const mx = (x0 + x1) >> 1, my = (y0 + y1) >> 1;
      for (let x = x0; x <= x1; x++)
        if (Math.abs(x - mx) > g) { set(x, y0, 1); set(x, y1, 1); }
      for (let y = y0; y <= y1; y++)
        if (Math.abs(y - my) > g) { set(x0, y, 1); set(x1, y, 1); }
    };
    const stampBase = (bx, by, kind) => {
      bx = Math.round(bx); by = Math.round(by);
      if (kind === 0) {
        // FORT: concentric walled compound — gates on all four approaches,
        // corner bastions, a command block at the heart
        const h = 11 + rn(4);
        wallRect(bx - h, by - h, bx + h, by + h, 2);
        wallRect(bx - h + 5, by - h + 5, bx + h - 5, by + h - 5, 2);
        fillRect(bx - 1, by - 1, 3, 3, 1);
        for (const [ux, uy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
          fillRect(bx + ux * h - 1, by + uy * h - 1, 3, 3, 1);
        bases.push({ x: bx, y: by, r: h + 3 });
      } else if (kind === 1) {
        // STATION: cross-armed dock — a hollow core, four flight corridors,
        // docking bays with mouths open to space at each arm's end
        const L = 9 + rn(4);
        fillRect(bx - 2, by - 2, 5, 5, 1);
        fillRect(bx - 1, by - 1, 3, 3, 0);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          for (let k = 3; k <= L + 1; k++) {
            set(bx + dx * k + dy * 2, by + dy * k + dx * 2, 1);
            set(bx + dx * k - dy * 2, by + dy * k - dx * 2, 1);
          }
          const px = bx + dx * (L + 3), py = by + dy * (L + 3);
          fillRect(px - 2, py - 2, 5, 5, 1);
          fillRect(px - 1, py - 1, 3, 3, 0);
          if (dx === 1) fillRect(px + 2, py - 1, 1, 3, 0);
          else if (dx === -1) fillRect(px - 2, py - 1, 1, 3, 0);
          else if (dy === 1) fillRect(px - 1, py + 2, 3, 1, 0);
          else fillRect(px - 1, py - 2, 3, 1, 0);
        }
        bases.push({ x: bx, y: by, r: L + 6 });
      } else {
        // YARD: hangar rows behind a gated perimeter — a shipyard, its
        // berths lined up with mechanical regularity
        const w = 12 + rn(4), hh = 8 + rn(3);
        wallRect(bx - w, by - hh, bx + w, by + hh, 3);
        for (const ry of [by - 4, by + 4])
          for (let x = bx - w + 3; x <= bx + w - 3; x++)
            if (Math.abs(x - bx) > 2) set(x, ry, 1);
        bases.push({ x: bx, y: by, r: Math.max(w, hh) + 3 });
      }
    };

    // guard stations ring the core at the approach radius — you pass them
    // on every run into the arena
    const nGuard = style === 'rings' ? 4 : 6;
    for (let i = 0; i < nGuard; i++) {
      const ang = i / nGuard * TAU + rng() * 0.5;
      const rad = QUAD * (0.2 + rng() * 0.08);
      stampBase(MC + Math.cos(ang) * rad, MC + Math.sin(ang) * rad, rn(3));
    }
    // frontier depots: most quadrants get a destination of their own, so
    // however far you roam there's somewhere to dock and something to raid
    for (let qy = 0; qy < GRID; qy++) {
      for (let qx = 0; qx < GRID; qx++) {
        const isCore = qx === (GRID >> 1) && qy === (GRID >> 1);
        const isFaction = Object.values(FACTIONS).some(F => F.qx === qx && F.qy === qy);
        if (isCore || isFaction || rng() < 0.25) continue;
        const bx = qx * QUAD + (QUAD >> 1) + rn(QUAD >> 1) - (QUAD >> 2);
        const by = qy * QUAD + (QUAD >> 1) + rn(QUAD >> 1) - (QUAD >> 2);
        stampBase(bx, by, rn(3));
        if (rng() < 0.3) stampBase(bx + 90 + rn(120), by + rn(160) - 80, rn(3));  // twin outpost
      }
    }

    // FACTION FORTRESSES: each squad's home sits at the heart of its corner
    // quadrant — triple-walled, gated on the axis toward the core, with the
    // mothership anchored in the keep
    W.motherships = {};
    for (const team of [1, 2, 3, 4]) {
      const F = FACTIONS[team];
      const bx = F.qx * QUAD + (QUAD >> 1), by = F.qy * QUAD + (QUAD >> 1);
      wallRect(bx - 26, by - 26, bx + 26, by + 26, 4);
      wallRect(bx - 17, by - 17, bx + 17, by + 17, 5);
      for (const [ux, uy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        fillRect(bx + ux * 26 - 2, by + uy * 26 - 2, 5, 5, 1);
        fillRect(bx + ux * 17 - 1, by + uy * 17 - 1, 3, 3, 1);
      }
      bases.push({ x: bx, y: by, r: 30 });
      W.motherships[team] = { team, x: (bx + 0.5) * TILE, y: (by + 0.5) * TILE };
    }

    // asteroid belts: rubble lives in BANDS around the sector, not
    // sprinkled everywhere — navigable arcs with real gaps
    const nBelt = style === 'rings' ? 4 : style === 'gauntlet' ? 6 : 8;
    for (let b = 0; b < nBelt; b++) {
      const a0 = rng() * TAU, span = 0.6 + rng() * 1.0;
      const rad = MAPS * (0.16 + rng() * 0.3);
      const wob = 5 + rn(8);
      const steps = Math.round(rad * span);
      for (let i = 0; i < steps; i++) {
        if (rng() < 0.62) continue;
        const ang = a0 + (i / steps) * span;
        const rr = rad + (rng() - 0.5) * wob * 2;
        const x = Math.round(MC + Math.cos(ang) * rr), y = Math.round(MC + Math.sin(ang) * rr);
        if (x < 6 || y < 6 || x > MAPS - 6 || y > MAPS - 6) continue;
        if (inClearing(x, y, 4) || nearBase(x, y, 8)) continue;
        fillRect(x, y, 1 + rn(3), 1 + rn(3), 1);
      }
    }

    // derelicts: lone broken hulls drifting in the deep — landmarks, cover,
    // and proof that people flew out here once
    for (let i = 0; i < 240; i++) {
      const x = 30 + rn(MAPS - 60), y = 30 + rn(MAPS - 60);
      if (inClearing(x, y, 10) || nearBase(x, y, 16) || hyp(x - MC, y - MC) < 60) continue;
      const w = 4 + rn(5), h = 3 + rn(4);
      fillRect(x, y, w, 1, 1); fillRect(x, y + h, w, 1, 1);
      fillRect(x, y, 1, h, 1);
      if (rng() < 0.6) fillRect(x + w - 1, y, 1, h, 1);
      fillRect(x + 1 + rn(Math.max(1, w - 2)), y, 2, 1, 0);   // hull breach
    }

    const C = MAPS / 2, AR = 21;
    const drawRing = (radius, gates, gateHalf) => {
      const steps = Math.max(720, radius * 40);
      for (let a = 0; a < steps; a++) {
        const ang = a / steps * TAU;
        const gate = gates.some(g => Math.abs(angleNorm(ang - g * TAU)) < gateHalf);
        if (!gate) {
          set(Math.round(C + Math.cos(ang) * radius), Math.round(C + Math.sin(ang) * radius), 1);
          set(Math.round(C + Math.cos(ang) * (radius + 1)), Math.round(C + Math.sin(ang) * (radius + 1)), 1);
        }
      }
    };
    // carve the battlegrounds clean (structures that leaned in get trimmed),
    // then the arena interior. Carving per-clearing keeps generation fast
    // even at a million tiles — a whole-map scan against every clearing
    // would take seconds.
    for (const cl of clearings.concat([{ x: C, y: C, r: AR - 1 }])) {
      const x0 = Math.max(2, Math.floor(cl.x - cl.r)), x1 = Math.min(MAPS - 2, Math.ceil(cl.x + cl.r) + 1);
      const y0 = Math.max(2, Math.floor(cl.y - cl.r)), y1 = Math.min(MAPS - 2, Math.ceil(cl.y + cl.r) + 1);
      for (let ty = y0; ty < y1; ty++)
        for (let tx = x0; tx < x1; tx++)
          if (hyp(tx - cl.x, ty - cl.y) < cl.r) set(tx, ty, 0);
    }
    drawRing(AR, [0, 0.25, 0.5, 0.75], 0.11);
    if (style === 'rings') {
      // concentric battle rings around the core
      drawRing(45, [0.125, 0.375, 0.625, 0.875], 0.05);
      drawRing(70, [0, 0.166, 0.333, 0.5, 0.666, 0.833], 0.035);
    }
    if (style === 'gauntlet') {
      // long broken corridor walls channel the core's fights into lanes
      const Q0 = (GRID >> 1) * QUAD;   // the core quadrant's origin
      for (let i = 0; i < 14; i++) {
        const horiz = rng() < 0.5;
        const len = 40 + rn(80);
        const px = Q0 + 10 + rn(QUAD - 20 - (horiz ? len : 0));
        const py = Q0 + 10 + rn(QUAD - 20 - (horiz ? 0 : len));
        let gapAt = 6 + rn(8);
        for (let k = 0; k < len; k++) {
          if (k === gapAt) { k += 3; gapAt = k + 8 + rn(8); continue; }
          const x = horiz ? px + k : px, y = horiz ? py : py + k;
          if (hyp(x - C, y - C) < AR + 4) continue;   // keep the arena clean
          if (inClearing(x, y, 0)) continue;          // and the open fields
          set(x, y, 1);
          set(horiz ? x : x + 1, horiz ? y + 1 : y, 1);
        }
      }
    }
    // bases in world px — prize caches spawn around them, giving every
    // installation a reason to be visited (and fought over)
    W.bases = bases.map(b => ({ x: (b.x + 0.5) * TILE, y: (b.y + 0.5) * TILE, r: b.r * TILE }));
  }

  function randClearPoint(W) {
    for (let i = 0; i < 200; i++) {
      const tx = 4 + irand(MAPS - 8), ty = 4 + irand(MAPS - 8);
      let ok = true;
      for (let j = -1; j <= 1 && ok; j++)
        for (let k = -1; k <= 1 && ok; k++)
          if (tileSolid(W, tx + k, ty + j)) ok = false;
      if (ok) return { x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE };
    }
    return { x: WORLD / 2, y: WORLD / 2 };
  }
  // A clear point in the mid-sector disc around the arena — the hotspot where
  // the population concentrates. The frontier beyond is for roaming, prize
  // runs, and long chases, not for respawn commutes.
  function midSectorPoint(W) {
    // hotspot radius is capped in absolute terms: however vast the sector,
    // the population concentrates in a fightable core and the rest is
    // frontier — that's what makes a distant contact worth chasing
    const HOT = Math.min(MAPS * 0.3, 190);
    for (let i = 0; i < 60; i++) {
      const a = rand(0, TAU), rr = Math.sqrt(rand()) * HOT;
      const tx = (MAPS / 2 + Math.cos(a) * rr) | 0, ty = (MAPS / 2 + Math.sin(a) * rr) | 0;
      let ok = true;
      for (let j = -1; j <= 1 && ok; j++)
        for (let k = -1; k <= 1 && ok; k++)
          if (tileSolid(W, tx + k, ty + j)) ok = false;
      if (ok) return { x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE };
    }
    return randClearPoint(W);
  }
  function findSpawn(W, self) {
    let best = null, bestD = -1;
    for (let i = 0; i < 40; i++) {
      const p = midSectorPoint(W);
      let nearest = 1e9;
      for (const o of W.ships) {
        if (o === self || o.dead) continue;
        nearest = Math.min(nearest, hyp(o.x - p.x, o.y - p.y));
      }
      if (nearest > 420) return p;
      if (nearest > bestD) { bestD = nearest; best = p; }
    }
    return best || { x: WORLD / 2, y: WORLD / 2 };
  }

  // ------------------------------------------------------------ world
  function createWorld(opts) {
    opts = opts || {};
    const W = {
      opts,
      rng: mulberry32(opts.seed == null ? 1337 : opts.seed),
      time: 0, prizeT: 0,
      map: null,
      ships: [], bullets: [], bombs: [], prizes: [],
      events: [],
      byId: new Map(),
      nextId: 1, nextPrizeId: 1,
    };
    genMap(W);
    genDanger(W);
    return W;
  }
  const ev = (W, e) => { W.events.push(e); };

  // ------------------------------------------------------------ the maelstrom
  // A danger zone in the frontier: a swirling storm of rock that tears
  // hulls on contact, seeded with wormholes that swallow the unwary and
  // spit them out inside it. Rock paths are CLOSED-FORM functions of world
  // time (epicycles around the storm's eye), so every client computes
  // identical positions from the shared seed — no netcode required.
  function genDanger(W) {
    const rng = W.rng;
    let cx = WORLD / 2 + WORLD * 0.3, cy = WORLD / 2;
    for (let i = 0; i < 60; i++) {
      const a = rng() * TAU, rad = WORLD * (0.28 + rng() * 0.1);
      const x = WORLD / 2 + Math.cos(a) * rad, y = WORLD / 2 + Math.sin(a) * rad;
      if (x < 3200 || y < 3200 || x > WORLD - 3200 || y > WORLD - 3200) continue;
      if ((W.bases || []).some(b => hyp(x - b.x, y - b.y) < b.r + 2800)) continue;
      cx = x; cy = y; break;
    }
    const R = 2300;
    W.danger = { x: cx, y: cy, r: R };
    W.rocks = [];
    for (let i = 0; i < 22; i++) {
      const r1 = 150 + rng() * (R - 400);
      W.rocks.push({
        r1,
        w1: (0.07 + rng() * 0.2) * (rng() < 0.5 ? -1 : 1) * (1.35 - (r1 / R) * 0.7),
        p1: rng() * TAU,
        a2: 40 + rng() * 150, w2: 0.3 + rng() * 1.1, p2: rng() * TAU,
        rad: 15 + rng() * 20, spin: (rng() - 0.5) * 2, shape: (rng() * 1e9) | 0,
      });
    }
    // three gates in normal space open INTO the storm; a fourth at the
    // storm's rim leads back toward the citadel — the way home
    W.wormholes = [];
    for (let i = 0; i < 6; i++) {
      let x = WORLD / 2 + 2000 + i * 900, y = WORLD / 2 + 2000;
      for (let t = 0; t < 40; t++) {
        const a = rng() * TAU, rad = WORLD * (0.14 + rng() * 0.3);
        const px = WORLD / 2 + Math.cos(a) * rad, py = WORLD / 2 + Math.sin(a) * rad;
        if (px < 900 || py < 900 || px > WORLD - 900 || py > WORLD - 900) continue;
        if (hyp(px - cx, py - cy) < R + 900) continue;
        if ((W.bases || []).some(b => hyp(px - b.x, py - b.y) < b.r + 600)) continue;
        if (rectSolid(W, px - 70, py - 70, 140, 140)) continue;
        x = px; y = py; break;
      }
      const da = rng() * TAU, dr = rng() * R * 0.45;
      W.wormholes.push({ x, y, dx: cx + Math.cos(da) * dr, dy: cy + Math.sin(da) * dr });
    }
    const ea = rng() * TAU;
    W.wormholes.push({
      x: cx + Math.cos(ea) * R * 0.9, y: cy + Math.sin(ea) * R * 0.9,
      dx: WORLD / 2 + Math.cos(ea) * 950, dy: WORLD / 2 + Math.sin(ea) * 950,
    });
    // faction gates: a jump from each squad's fortress door straight to the
    // core's rim — territory means a safe rear base WITH a lane to the war
    for (const team of [1, 2, 3, 4]) {
      const ms = W.motherships && W.motherships[team];
      if (!ms) continue;
      const ddx = WORLD / 2 - ms.x, ddy = WORLD / 2 - ms.y;
      const L = hyp(ddx, ddy) || 1;
      W.wormholes.push({
        x: ms.x + (ddx / L) * 560, y: ms.y + (ddy / L) * 560, r: 90, gate: team,
        dx: WORLD / 2 - (ddx / L) * 2800, dy: WORLD / 2 - (ddy / L) * 2800,
      });
    }

    // THE DEAD ZONE: one edge quadrant belongs to nobody and never will —
    // marauder country, relic-rich, no law
    const dzc = [[GRID >> 1, 0], [0, GRID >> 1], [GRID - 1, GRID >> 1], [GRID >> 1, GRID - 1]];
    const dqx = (cx / QUADPX) | 0, dqy = (cy / QUADPX) | 0;
    let dz = dzc[(rng() * 4) | 0];
    if (dz[0] === dqx && dz[1] === dqy) dz = dzc.find(c => c[0] !== dqx || c[1] !== dqy);
    W.deadZone = { qx: dz[0], qy: dz[1] };
    terrInit(W);

    // RELIC SLOTS: rare tech needed for top-tier upgrades, cached only in
    // dangerous places — the storm's heart, the dead zone, rival fortress
    // quadrants, and the belts. Deterministic positions; slots respawn 240s
    // after being salvaged.
    W.relicSlots = [];
    for (let i = 0; i < 14; i++) {
      const r = rng();
      let x, y;
      if (r < 0.3) {                       // the maelstrom's interior
        const a = rng() * TAU, rr = Math.sqrt(rng()) * R * 0.7;
        x = cx + Math.cos(a) * rr; y = cy + Math.sin(a) * rr;
      } else if (r < 0.55) {               // the dead zone
        x = (W.deadZone.qx + 0.15 + rng() * 0.7) * QUADPX;
        y = (W.deadZone.qy + 0.15 + rng() * 0.7) * QUADPX;
      } else if (r < 0.8) {                // a rival fortress quadrant
        const F = FACTIONS[1 + ((rng() * 4) | 0)];
        x = (F.qx + 0.12 + rng() * 0.76) * QUADPX;
        y = (F.qy + 0.12 + rng() * 0.76) * QUADPX;
      } else {                             // out along a belt band
        const a = rng() * TAU, rr = WORLD * (0.16 + rng() * 0.3);
        x = WORLD / 2 + Math.cos(a) * rr; y = WORLD / 2 + Math.sin(a) * rr;
      }
      x = clamp(x, 800, WORLD - 800); y = clamp(y, 800, WORLD - 800);
      const p = findClearNear(W, x, y) || { x, y };
      W.relicSlots.push({ x: p.x, y: p.y, taken: -999 });
    }
  }
  // ------------------------------------------------------------ territory
  const quadOf = (x, y) => ({
    qx: clamp((x / QUADPX) | 0, 0, GRID - 1),
    qy: clamp((y / QUADPX) | 0, 0, GRID - 1),
  });
  const qKey = (qx, qy) => qy * GRID + qx;
  function terrOwner(W, x, y) {
    // inlined quadrant math — this runs per teamed ship per step
    if (!W.terr) return 0;
    const qx = clamp((x / QUADPX) | 0, 0, GRID - 1), qy = clamp((y / QUADPX) | 0, 0, GRID - 1);
    const t = W.terr[qy * GRID + qx];
    return t ? t.own : 0;
  }
  function terrInit(W) {
    W.terr = {};
    for (const team of [1, 2, 3, 4]) {
      const F = FACTIONS[team];
      W.terr[qKey(F.qx, F.qy)] = { own: team, home: team, p: {} };
    }
  }
  // presence converts quadrants: sole majority for 45 accumulated seconds
  // flips a frontier quadrant. Homes never fall, the core is forever
  // contested, and no law reaches the dead zone.
  function terrTick(W, tick) {
    const MID = GRID >> 1;
    const pres = {};
    for (const s of W.ships) {
      if (s.dead || !s.team || s.team > 4) continue;
      const q = quadOf(s.x, s.y);
      const k = qKey(q.qx, q.qy);
      const row = pres[k] || (pres[k] = {});
      row[s.team] = (row[s.team] || 0) + 1;
    }
    // capture progress erodes in ABSENCE too — 44s of pressure must not sit
    // frozen forever in an empty quadrant waiting for one ship to finish it
    for (const k in W.terr) {
      if (pres[k]) continue;
      const T = W.terr[k];
      for (const tm in T.p) {
        T.p[tm] = Math.max(0, T.p[tm] - tick * 0.5);
        if (!T.p[tm]) delete T.p[tm];
      }
    }
    for (const k in pres) {
      const kn = +k, qx = kn % GRID, qy = (kn / GRID) | 0;
      if (qx === MID && qy === MID) continue;
      if (W.deadZone && W.deadZone.qx === qx && W.deadZone.qy === qy) continue;
      const T = W.terr[kn] || (W.terr[kn] = { own: 0, p: {} });
      if (T.home) continue;
      let top = 0, topN = 0, second = 0;
      for (const tm in pres[k]) {
        const n = pres[k][tm];
        if (n > topN) { second = topN; topN = n; top = +tm; }
        else if (n > second) second = n;
      }
      if (top && topN > second) {
        if (top === T.own) { T.p = {}; continue; }
        T.p[top] = (T.p[top] || 0) + tick;
        if (T.p[top] >= 45) {
          const prev = T.own;
          T.own = top; T.p = {};
          ev(W, { e: 'capture', qx, qy, team: top, prev });
        }
      } else {
        for (const tm in T.p) T.p[tm] = Math.max(0, T.p[tm] - tick * 0.5);
      }
    }
  }

  // ------------------------------------------------------------ events
  // Generated events on a DETERMINISTIC timeline (a pure function of seed
  // and world time, like the storm rocks) — every client computes the same
  // asteroid shower, marauder raid, or stellar collapse at the same moment.
  const EV_PERIOD = 115, EV_LEAD = 18;
  function evRnd(W, idx, n) {
    // murmur3 finalizer: consecutive indices must decorrelate fully
    let h = (((W.opts.seed | 0) >>> 0) + Math.imul(idx + 1, 0x9E3779B1) + Math.imul(n + 1, 0x85EBCA77)) >>> 0;
    h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35) >>> 0;
    h ^= h >>> 16;

      if (diff < 0.14 && d < 640 && s.energy > s.maxEnergy * 0.3) c.gun = true;
      if (s.bombCd <= 0 && diff < 0.09 && d > 230 && d < 800 &&
          s.energy > s.t.bombCost + 350 && losClear(W, s.x, s.y, t.x, t.y)) c.bomb = true;
      if (d < 170 && s.bursts > 0 && s.burstCd <= 0) doBurst(W, s);
      if (s.rockets > 0 && d > 700 && s.energy > s.maxEnergy * 0.7 && Math.random() < 0.003) fireRocket(W, s);
    } else if (a.mode === 'flee' && t) {
      desired = Math.atan2(s.y - t.y, s.x - t.x); th = 1;
      if (dist2(s, t) < 240 && s.repels > 0 && s.repelCd <= 0) doRepel(W, s);
      if (s.t.blink && s.blinkCd <= 0 && s.energy > 600 &&
          Math.abs(angleNorm(desired - s.angle)) < 0.4) doBlink(W, s);
      if (s.rockets > 0 && s.rocketT <= 0) fireRocket(W, s);
    } else {
      // wingmates: no target means form on the leader, not wander off
      const ldr = a.escort ? W.byId.get(a.escort) : null;
      if (ldr && !ldr.dead) {
        const dl = hyp(ldr.x - s.x, ldr.y - s.y);
        if (dl > 340) {
          a.wp = { x: ldr.x + rand(-170, 170), y: ldr.y + rand(-170, 170) };
        } else if (dl < 120) {
          a.wp = null;
          desired = s.angle; th = 0;
          c.turn = clamp(angleNorm(ldr.angle - s.angle) * 3, -1, 1);
          c.thrust = 0;
          return;
        }
      }
      if (!a.wp || hyp(a.wp.x - s.x, a.wp.y - s.y) < 90) {
        let pz = null, pd = 800;
        for (const p of W.prizes) {
          const d = hyp(p.x - s.x, p.y - s.y);
          if (d < pd) { pd = d; pz = p; }
        }
        // no green in reach: mostly drift back toward the mid-sector hotspot
        // (keeps the zone's fights findable in an endless map), sometimes
        // wander LOCALLY — never a blind trek across 100km of nothing
        if (pz) a.wp = { x: pz.x, y: pz.y };
        else if (Math.random() < 0.6) a.wp = midSectorPoint(W);
        else {
          const a2 = rand(0, TAU), rr2 = rand(1200, 4200);
          const nx = clamp(s.x + Math.cos(a2) * rr2, TILE * 4, WORLD - TILE * 4);
          const ny = clamp(s.y + Math.sin(a2) * rr2, TILE * 4, WORLD - TILE * 4);
          a.wp = solidAtPx(W, nx, ny) ? midSectorPoint(W) : { x: nx, y: ny };
        }
      }
      desired = Math.atan2(a.wp.y - s.y, a.wp.x - s.x); th = 0.85;
    }

    const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
    if (solidAtPx(W, s.x + ca * 70, s.y + sa * 70) || solidAtPx(W, s.x + ca * 40, s.y + sa * 40)) {
      const L = solidAtPx(W, s.x + Math.cos(s.angle - 0.9) * 70, s.y + Math.sin(s.angle - 0.9) * 70);
      const R = solidAtPx(W, s.x + Math.cos(s.angle + 0.9) * 70, s.y + Math.sin(s.angle + 0.9) * 70);
      if (!a.avoid) a.avoid = Math.random() < 0.5 ? 1 : -1;
      desired = s.angle + (L && !R ? 1.6 : R && !L ? -1.6 : a.avoid * 2.2);
      th = Math.min(th, 0.15);
    } else a.avoid = 0;

    c.turn = clamp(angleNorm(desired - s.angle) * 4, -1, 1);
    c.thrust = th;
  }

  // ------------------------------------------------------------ ship update
  function updateShip(W, s, dt) {
    if (s.dead) {
      if (!s.remote && !s.dormant) {
        s.respawn -= dt;
        if (s.respawn <= 0) spawnShip(W, s);
      }
      return;
    }
    if (s.remote) {
      if (W.opts.ghostInterp && s.snaps && s.snaps.length) {
        // jitter-buffered interpolation: render ~100ms in the past, lerping
        // between timestamped snapshots; extrapolate briefly on packet loss
        const snaps = s.snaps;
        const tt = (W.opts.now ? W.opts.now() : 0) - 0.1;
        while (snaps.length > 2 && snaps[1].rt <= tt) snaps.shift();
        const last = snaps[snaps.length - 1];
        if (snaps.length >= 2 && tt <= last.rt) {
          const p0 = snaps[0], p1 = snaps[1];
          const span = Math.max(1e-4, p1.rt - p0.rt);
          const f = clamp((tt - p0.rt) / span, 0, 1);
          s.x = p0.x + (p1.x - p0.x) * f;
          s.y = p0.y + (p1.y - p0.y) * f;
          s.angle = p0.a + angleNorm(p1.a - p0.a) * f;
        } else {
          const ex = clamp(tt - last.rt, 0, 0.15);
          s.x = last.x + last.vx * ex;
          s.y = last.y + last.vy * ex;
          s.angle = last.a;
        }
        s.vx = last.vx; s.vy = last.vy;
        s.ctl.thrust = last.th;
        s.energy = last.frac * s.maxEnergy;
      } else {
        // dead reckoning fallback (used by the server's ghost view)
        s.netT += dt;
        const tx = s.netX + s.netVx * s.netT;
        const ty = s.netY + s.netVy * s.netT;
        const k = Math.min(1, dt * 10);
        s.x += (tx - s.x) * k;
        s.y += (ty - s.y) * k;
        s.vx = s.netVx; s.vy = s.netVy;
        s.angle += angleNorm(s.netA - s.angle) * Math.min(1, dt * 12);
        s.ctl.thrust = s.netTh;
        s.energy = s.netFrac * s.maxEnergy;
      }
      if (s.flash > 0) s.flash -= dt;
      if (s.safe > 0) s.safe -= dt;
      return;
    }
    if (s.bot) updateAI(W, s, dt);
    const c = s.ctl;

    s.angle += c.turn * s.t.turn * dt;

    let th = c.thrust;
    let maxSp = s.maxSpeed;
    let power = s.thrust;
    if (s.rocketT > 0) {
      s.rocketT -= dt;
      th = 1; maxSp *= 1.9; power *= 2.6;
    }
    if (th !== 0) {
      // real backthrust: reversing is a fighting move, not a suggestion
      const p = power * (th > 0 ? th : th * 0.85);
      s.vx += Math.cos(s.angle) * p * dt;
      s.vy += Math.sin(s.angle) * p * dt;
    }
    // lateral strafe thrusters: full omnidirectional control
    if (c.strafe) {
      const sp2 = power * 0.75 * clamp(c.strafe, -1, 1);
      s.vx += Math.cos(s.angle + Math.PI / 2) * sp2 * dt;
      s.vy += Math.sin(s.angle + Math.PI / 2) * sp2 * dt;
    }
    // coast damping: hands-off means the ship settles instead of drifting
    // forever — agile hulls (Dagger, Comet, Phantom) stop crisply, heavies
    // (Titan, Aegis) keep their momentum. Inertia still rules mid-fight.
    if (th === 0 && !c.strafe && s.rocketT <= 0) {
      const kd = 1 - (s.t.damp == null ? 0.25 : s.t.damp) * dt;
      s.vx *= kd; s.vy *= kd;
    }
    const sp = hyp(s.vx, s.vy);
    if (sp > maxSp) {
      const k = Math.max(maxSp / sp, 1 - 2.5 * dt);
      s.vx *= k; s.vy *= k;
    }

    const r = s.t.radius;
    const nx = s.x + s.vx * dt;
    if (rectSolid(W, nx - r, s.y - r, r * 2, r * 2)) {
      if (Math.abs(s.vx) > 120) ev(W, { e: 'shipBounce', x: s.x, y: s.y });
      s.vx *= -s.t.bounce;
    } else s.x = nx;
    const ny = s.y + s.vy * dt;
    if (rectSolid(W, s.x - r, ny - r, r * 2, r * 2)) {
      if (Math.abs(s.vy) > 120) ev(W, { e: 'shipBounce', x: s.x, y: s.y });
      s.vy *= -s.t.bounce;
    } else s.y = ny;
    s.x = clamp(s.x, TILE * 2 + r, WORLD - TILE * 2 - r);
    s.y = clamp(s.y, TILE * 2 + r, WORLD - TILE * 2 - r);

    // warden aura: allied wardens nearby boost recharge; the mothership's
    // shadow rearms its squad far faster still
    let rech = s.recharge;
    if (s.team) {
      const ms = W.motherships && W.motherships[s.team];
      if (ms && hyp(ms.x - s.x, ms.y - s.y) < 700) rech *= 2.4;
      else if (terrOwner(W, s.x, s.y) === s.team) rech *= 1.3;  // held ground favors its holders
      for (const o of (W._wardens || [])) {
        if (o === s || o.team !== s.team) continue;
        if (hyp(o.x - s.x, o.y - s.y) < 170) { rech *= 1.35; break; }
      }
    }
    s.energy = Math.min(s.maxEnergy, s.energy + rech * dt);
    s.gunCd -= dt; s.bombCd -= dt; s.repelCd -= dt; s.burstCd -= dt; s.blinkCd -= dt; s.warpCd -= dt;
    if (s.safe > 0) s.safe -= dt;
    if (s.flash > 0) s.flash -= dt;

    // warden repel rack regen
    if (s.t.repelRegen) {
      s.regenT += dt;
      if (s.regenT >= s.t.repelRegen) {
        s.regenT = 0;
        if (s.repels < (s.t.repelCap || 3)) {
          s.repels++;
          ev(W, { e: 'restock', id: s.id });
        }
      }
    }

    if (c.gun) fireGun(W, s);
    if (c.bomb) fireBomb(W, s);

    // greens: each peer only handles pickups for ships it owns
    for (let i = W.prizes.length - 1; i >= 0; i--) {
      const p = W.prizes[i];
      if (hyp(p.x - s.x, p.y - s.y) < s.t.radius + 11) {
        W.prizes.splice(i, 1);
        ev(W, { e: 'take', id: s.id, prize: p.id, x: p.x, y: p.y });
        applyPrize(W, s, false);
      }
    }
  }

  // ------------------------------------------------------------ projectiles
  function updateBullets(W, dt) {
    for (let i = W.bullets.length - 1; i >= 0; i--) {
      const b = W.bullets[i];
      b.life -= dt;
      if (b.life <= 0) { W.bullets.splice(i, 1); continue; }
      let dead = false;
      const h = dt / 2;
      for (let step = 0; step < 2 && !dead; step++) {
        const bx = b.x + b.vx * h;
        if (solidAtPx(W, bx, b.y)) {
          if (b.bounces > 0) { b.bounces--; b.vx = -b.vx; }
          else { ev(W, { e: 'bhit', x: b.x, y: b.y }); dead = true; break; }
        } else b.x = bx;
        const by = b.y + b.vy * h;
        if (solidAtPx(W, b.x, by)) {
          if (b.bounces > 0) { b.bounces--; b.vy = -b.vy; }
          else { ev(W, { e: 'bhit', x: b.x, y: b.y }); dead = true; break; }
        } else b.y = by;
        for (const s of W.ships) {
          if (s.dead || s === b.owner) continue;
          if (s.team && b.owner && s.team === b.owner.team) continue; // pass through teammates
          if (hyp(s.x - b.x, s.y - b.y) < s.t.radius + 3) {
            damageShip(W, s, b.dmg, b.owner);
            dead = true; break;
          }
        }
      }
      if (dead) W.bullets.splice(i, 1);
    }
  }

  function updateBombs(W, dt) {
    for (let i = W.bombs.length - 1; i >= 0; i--) {
      const b = W.bombs[i];
      b.life -= dt;
      if (b.life <= 0) { W.bombs.splice(i, 1); continue; }
      let boom = false;
      const h = dt / 2;
      for (let step = 0; step < 2 && !boom; step++) {
        const bx = b.x + b.vx * h;
        if (solidAtPx(W, bx, b.y)) {
          if (b.bounces > 0) { b.bounces--; b.vx = -b.vx; }
          else boom = true;
        } else b.x = bx;
        if (boom) break;
        const by = b.y + b.vy * h;
        if (solidAtPx(W, b.x, by)) {
          if (b.bounces > 0) { b.bounces--; b.vy = -b.vy; }
          else boom = true;
        } else b.y = by;
        if (boom) break;
        for (const s of W.ships) {
          if (s.dead || s === b.owner) continue;
          if (s.team && b.owner && s.team === b.owner.team) continue;
          if (hyp(s.x - b.x, s.y - b.y) < s.t.radius + (b.prox || 15)) { boom = true; break; }
        }
      }
      if (boom) {
        W.bombs.splice(i, 1);
        explode(W, b.x, b.y, b.level, b.owner);
      }
    }
  }

  // ------------------------------------------------------------ tick
  function updateWorld(W, dt) {
    W.time += dt;
    if (W.opts.spawnPrizes) {
      W.prizeT -= dt;
      if (W.prizeT <= 0) {
        W.prizeT = 1.4;
        if (W.prizes.length < PRIZE_CAP) {
          // a third of the greens cache around installations — bases are
          // supply depots, worth flying to and worth fighting over — and a
          // share falls inside the maelstrom: the best loot sits in the storm
          // in an endless world, loot follows the population: bases,
          // the maelstrom, and the contested mid-sector get most of it —
          // the rest scatters for the far roamers to stumble on
          let p = null;
          const roll = Math.random();
          if (W.bases && W.bases.length && roll < 0.35) {
            const b = W.bases[irand(W.bases.length)];
            p = findClearNear(W, b.x + rand(-0.6, 0.6) * b.r, b.y + rand(-0.6, 0.6) * b.r);
          } else if (W.danger && roll < 0.5) {
            const a = rand(0, TAU), rr = Math.sqrt(rand()) * W.danger.r * 0.85;
            p = findClearNear(W, W.danger.x + Math.cos(a) * rr, W.danger.y + Math.sin(a) * rr);
          } else if (roll < 0.78) {
            p = midSectorPoint(W);
          }
          if (!p) p = randClearPoint(W);
          const pr = addPrize(W, p.x, p.y);
          ev(W, { e: 'prizeSpawn', prize: pr.id, x: pr.x, y: pr.y });
        }
      }
      for (let i = W.prizes.length - 1; i >= 0; i--) {
        W.prizes[i].ttl -= dt;
        if (W.prizes[i].ttl <= 0) {
          ev(W, { e: 'prizeGone', prize: W.prizes[i].id });
          W.prizes.splice(i, 1);
        }
      }
    }
    // territorial war: presence flips quadrants (authority world only —
    // online clients apply the server's capture broadcasts instead)
    if (W.terr && W.opts.authority) {
      W.terrT = (W.terrT || 0) + dt;
      if (W.terrT >= 1) { terrTick(W, W.terrT); W.terrT = 0; }
    }

    // generated events: showers, raids, stellar collapse — all computed
    // from the shared deterministic timeline
    const EVT = W.evt = evActive(W);
    if (EVT) {
      if (EVT.type === 'shower') {
        for (const s of W.ships) {
          if (s.dead || s.remote || s.rockT > 0) continue;
          if (Math.abs(s.x - EVT.x) > QUADPX * 0.8 || Math.abs(s.y - EVT.y) > QUADPX * 0.8) continue;
          for (let i = 0; i < 12; i++) {
            const q = showerRockAt(W, EVT, i);
            const d = hyp(s.x - q.x, s.y - q.y);
            if (d < q.rad + s.t.radius) {
              const rel = hyp(s.vx - q.vx, s.vy - q.vy);
              const inv = 1 / Math.max(1, d);
              s.vx += (s.x - q.x) * inv * (160 + rel * 0.35);
              s.vy += (s.y - q.y) * inv * (160 + rel * 0.35);
              s.rockT = 0.7;
              ev(W, { e: 'rockhit', id: s.id, x: q.x, y: q.y, rel });
              damageShip(W, s, 120 + rel * 0.4, null);
              break;
            }
          }
        }
      } else if (EVT.type === 'nova') {
        const bt = EVT.t - EV_LEAD;          // time since detonation
        if (bt > 0) {
          const R2 = (bt / 6) * 3200;        // expanding front
          for (const s of W.ships) {
            if (s.dead || s.remote) continue;
            if (s.novaT > 0) continue;       // grace timer decays in the hazard loop
            const d = hyp(s.x - EVT.x, s.y - EVT.y);
            if (Math.abs(d - R2) < 170) {
              const inv = 1 / Math.max(1, d);
              s.vx += (s.x - EVT.x) * inv * 520;
              s.vy += (s.y - EVT.y) * inv * 520;
              s.novaT = 1.2;
              ev(W, { e: 'novahit', id: s.id, x: s.x, y: s.y });
              damageShip(W, s, 480 * (1 - bt / 12), null);
            }
          }
        }
      } else if (EVT.type === 'marauders') {
        // the authority spawns the raiders; everyone else sees them as bots.
        // Survivors are NOT cleaned up — they prowl until somebody collects.
        if (W.opts.authority && W.evtSpawned !== EVT.idx) {
          W.evtSpawned = EVT.idx;
          const prowling = W.ships.filter(s => s.marauder && !s.dead).length;
          for (let i = 0; i < 3 && prowling + i < 7; i++) {
            const m = makeShip(W, pick(['dagger', 'reaper', 'comet']), 'bot', 'Marauder', null, 5);
            m.marauder = true;
            m.ai.skill = 0.8;
            m.bounty = 60;                   // their heads are worth credits
            spawnShip(W, m);
            const p = findClearNear(W, EVT.x + rand(-500, 500), EVT.y + rand(-500, 500)) || { x: EVT.x, y: EVT.y };
            m.x = p.x; m.y = p.y;
            ev(W, { e: 'raider', id: m.id, name: m.name, ship: m.type, hue: m.hue, x: m.x, y: m.y });
          }
        }
      }
    }

    // relic salvage: local human pilots only — bots have no use for tech
    if (W.relicSlots) {
      for (const s of W.ships) {
        if (s.dead || s.remote || s.bot || !s.noGreens) continue;
        for (let i = 0; i < W.relicSlots.length; i++) {
          const sl = W.relicSlots[i];
          if (W.time - sl.taken < 240 && sl.taken > -1) continue;
          if (hyp(s.x - sl.x, s.y - sl.y) < 30 + s.t.radius) {
            sl.taken = W.time;
            ev(W, { e: 'relic', id: s.id, slot: i, x: sl.x, y: sl.y });
          }
        }
      }
    }

    // the maelstrom: storm rock tears local hulls; wormholes swallow anyone
    // who strays too close (remote ghosts are handled by their own owner)
    if (W.danger) {
      for (const s of W.ships) {
        if (s.dead || s.remote) continue;
        if (s.rockT > 0) s.rockT -= dt;
        if (s.wormT > 0) s.wormT -= dt;
        if (s.novaT > 0) s.novaT -= dt;   // decays ALWAYS, not only mid-nova —
                                          // stale grace must not shield the next collapse
        if (s.rockT <= 0 && hyp(s.x - W.danger.x, s.y - W.danger.y) < W.danger.r + 250) {
          for (const rk of W.rocks) {
            const q = rockAt(W, rk, W.time);
            const d = hyp(s.x - q.x, s.y - q.y);
            if (d < rk.rad + s.t.radius) {
              const rel = hyp(s.vx - q.vx, s.vy - q.vy);
              const inv = 1 / Math.max(1, d);
              s.vx += (s.x - q.x) * inv * (180 + rel * 0.4);
              s.vy += (s.y - q.y) * inv * (180 + rel * 0.4);
              s.rockT = 0.7;
              ev(W, { e: 'rockhit', id: s.id, x: q.x, y: q.y, rel });
              damageShip(W, s, 140 + rel * 0.45, null);
              break;
            }
          }
        }
        if (s.wormT <= 0) {
          for (const wh of W.wormholes) {
            if (hyp(s.x - wh.x, s.y - wh.y) < (wh.r || 58)) {
              ev(W, { e: 'worm', id: s.id, x0: s.x, y0: s.y, x1: wh.dx, y1: wh.dy, hue: s.hue });
              s.x = wh.dx; s.y = wh.dy;
              s.wormT = 4;
              s.rockT = Math.max(s.rockT, 1.5);   // a breath before the storm bites
              s.safe = Math.max(s.safe, 1.2);
              break;
            }
          }
        }
      }
    }
    // per-step warden roster: keeps the aura check O(ships), not O(ships^2)
    const wl = W._wardens || (W._wardens = []);
    wl.length = 0;
    for (const o of W.ships) if (!o.dead && o.team && o.type === 'warden') wl.push(o);
    for (const s of W.ships) updateShip(W, s, dt);
    updateBullets(W, dt);
    updateBombs(W, dt);
  }
  function drainEvents(W) {
    const out = W.events;
    W.events = [];
    return out;
  }

  return {
    TAU, TILE, MAPS, WORLD, STEP, PRIZE_CAP, QUAD, QUADPX, GRID, FACTIONS,
    SHIP_ORDER, SHIP_TYPES, PRIZE_TYPES, BOT_NAMES, HUES,
    clamp, rand, irand, pick, angleNorm, mulberry32,
    tileSolid, solidAtPx, rectSolid, losClear, randClearPoint, findSpawn, rockAt,
    quadOf, terrOwner, evActive, showerRockAt, EV_LEAD,
    createWorld, makeShip, removeShip, spawnShip, addBots,
    applyLoadoutDefaults, applyPrize, addPrize, removePrizeById,
    fireGun, fireBomb, doRepel, doBurst, fireRocket, doBlink, warpToBeacon,
    injectGun, injectBomb, injectRepel, injectBurst,
    damageShip, killShip, explode,
    updateWorld, drainEvents,
  };
});

</script>
<script>
/* ==== inlined client.js ==== */
/* =========================================================================
   INTERSTELLAR — browser client
   Rendering (sprites + bloom), input, menus, audio, and the relay
   netcode client. All world simulation lives in sim.js (shared with the
   server); this file owns everything the player sees and hears.
   ========================================================================= */
(function () {
  'use strict';
  const GLOBAL = typeof window !== 'undefined' ? window : globalThis;
  const SIM = GLOBAL.SIM;
  const { TAU, TILE, MAPS, WORLD, STEP, SHIP_ORDER, SHIP_TYPES, clamp, rand, angleNorm } = SIM;
  const hyp = (a, b) => Math.sqrt(a * a + b * b);
  const irand = n => (Math.random() * n) | 0;

  // ---------------------------------------------------------------- state
  const G = {
    state: 'boot',      // title | select | nameentry | connecting | error | play
    online: false,
    paused: false, muted: false,
    qual: 2, fpsEMA: 60,  // adaptive quality: 2 full, 1 native-res, 0 lean
    contacts: new Map(), contactFx: [], contactT: 0,  // radar contact pings
    time: 0, beepT: 0,
    W: null,            // sim world

      if ((s16 & 3) === 0) musKick(t, TH.kickMax);
      if ((s16 & 3) === 2) musHat(t, 0.05, 0.11);       // open offbeat hats
      if ((s16 & 1) === 1) musHat(swung, 0.02, 0.03);
      if (s16 === 4 || s16 === 12) musSnare(t, 0.16);
      // full shaker groove, denser as the fight burns hotter
      musShak((s16 & 1) ? swung : t, (0.014 + 0.02 * heat) * MUS_SHAK_ACC[s16 & 3]);
      if ((s16 === 7 || s16 === 15) && heat > 0.35 && Math.random() < 0.6) musSnare(t, 0.045); // ghosts
      if ((bar & 1) === 1 && (s16 === 3 || s16 === 11)) musRim(t, 0.05);
      if (TH.dark && (s16 === 5 || s16 === 13)) musRim(t, 0.06);   // the storm rattles
      // rolling bass with passing tones walking into the next bar
      if ((s16 & 3) !== 0 && !(fillBar && s16 >= 8))
        musBass(t, root - 12 + (s16 === 14 ? 10 : (s16 === 6 || s16 === 10) ? 12 : 0), 0.2);
      if (anthem === 0) {
        // acid phase: per-bar pattern with a slowly breathing filter
        const seed = (MUS.prog * 31 + bar) * 16 + s16;
        if (musRnd(seed) < 0.62) {
          const scl = TH.dark ? [0, 3, 6, 9, 12] : [0, 3, 5, 7, 10, 12];   // storm runs diminished
          const m = root + scl[(musRnd(seed + 1) * scl.length) | 0] + (musRnd(seed + 2) < 0.2 ? 24 : 12);
          const breathe = 0.5 + 0.5 * Math.sin((bar + s16 / 16) * 0.7);
          musAcid(t, m, 500 + 2400 * breathe, musRnd(seed + 3) < 0.25 ? 0.16 : 0.1);
        }
        if ((bar & 1) === 0 && (s16 === 0 || s16 === 6)) musStab(t, chord, 0.09);
      } else {
        // anthem phase: the theme on supersaw, rave piano jabbing under it
        // (the storm gets no anthem — its acid never lets up)
        if (hook != null && !TH.dark) {
          const dur = (hp === 8 || hp === 24) ? SD * 3.6 : SD * 1.8;
          musLead(t, 57 + hook + 12, dur, 0.17);
        }
        if (s16 === 2 || s16 === 6 || s16 === 9 || s16 === 12) musPiano(t, chord, 0.14);
      }
      if (fillBar && s16 >= 8 && (s16 & 1) === 0) musTom(t, 230 - (s16 - 8) * 18, 0.16);  // tom run
      if (Math.random() < 0.012) musNote(t, midiF(96), 1.2, 0.04, 'sine', 0, true);
    }
  }
  function musicTick() {
    if (!SFX.ctx || !MUS.on || G.muted || SFX.ctx.state !== 'running') return;
    musicInit();
    const now = SFX.ctx.currentTime;
    if (MUS.nextT < now - 0.3) MUS.nextT = now + 0.05;  // resync after tab sleep
    // a deep 1.2s lookahead: a stalled main thread (heavy frame, chunk
    // bake, throttled tab at 1Hz timers) must never starve the audio
    // queue — dropouts read as "the music cuts in and out"
    const ahead = now + 1.2;
    while (MUS.nextT < ahead) {
      musScheduleStep(MUS.step, MUS.nextT);
      MUS.step++;
      MUS.nextT += stepOf();   // tempo belongs to the palette
    }
  }

  // ---------------------------------------------------------------- messages
  function say(text, color) {
    G.msgs.push({ text, color: color || '#8f8', t: 0 });
    if (G.msgs.length > 40) G.msgs.shift();
  }
  function banner(main, sub, dur) {
    G.banner = { main, sub: sub || '', t: 0, dur: dur || 2.6 };
  }

  // ---------------------------------------------------------------- match logic
  function myTeam() { return G.player ? G.player.team : 0; }
  function matchScoreKill(e) {
    const m = G.match;
    if (!m || m.over || m.online || !e.vTeam) return;
    if (m.mode === 'core') return;   // core rounds are won by holding the ring
    if (e.kTeam && e.kTeam !== e.vTeam) { if (e.kTeam === 1) m.a++; else m.b++; }
    else { if (e.vTeam === 1) m.b++; else m.a++; }   // suicide feeds the enemy
    checkMatchEnd();
  }
  function checkMatchEnd() {
    const m = G.match;
    if (!m || m.over || (m.a < m.target && m.b < m.target)) return;
    m.over = true;
    const winTeam = m.a >= m.target ? 1 : 2;
    const won = winTeam === myTeam();
    banner(won ? 'VICTORY' : 'DEFEAT', 'ENTER — rematch  ·  BACKSPACE — hangar', 30);
    if (won) sndWin(); else sndLose();
    if (m.mode === 'duel') {
      if (won) G.duelW++; else G.duelL++;
      try { GLOBAL.localStorage.setItem('interstellar-duels', G.duelW + ',' + G.duelL); } catch (err) { }
    }
  }

  // ---------------------------------------------------------------- fx
  // particle budget shrinks in lean quality mode
  function partCap() { return G.qual === 0 ? 380 : 800; }
  // particles are pure eye candy: never spawn them for action the camera
  // can't see, or the cap fills with invisible glows from 40km away
  function spark(x, y, hue, n, speed) {
    if (!nearCam(x, y)) return;
    for (let i = 0; i < n; i++) {
      if (G.parts.length > partCap()) return;
      const a = rand(0, TAU), sp = rand(0.2, 1) * speed;
      G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.7), max: 0.7, hue, kind: 'spark' });
    }
  }
  function puff(x, y, hue, n, speed, size) {
    if (!nearCam(x, y)) return;
    for (let i = 0; i < n; i++) {
      if (G.parts.length > partCap()) return;
      const a = rand(0, TAU), sp = rand(0.1, 1) * speed;
      G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 1), max: 1, hue, kind: 'puff', size: size * rand(0.6, 1.4) });
    }
  }
  function debris(x, y, hue, n) {
    if (!nearCam(x, y)) return;
    for (let i = 0; i < n; i++) {
      if (G.parts.length > partCap()) return;
      const a = rand(0, TAU), sp = rand(60, 320);
      G.parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(0.5, 1.2), max: 1.2, hue, kind: 'debris',
        rot: rand(0, TAU), rotV: rand(-8, 8), size: rand(2.5, 6),
      });
    }
  }
  function flash(x, y, size, hue) {
    if (!nearCam(x, y)) return;
    G.parts.push({ x, y, vx: 0, vy: 0, life: 0.09, max: 0.09, hue, kind: 'flash', size });
  }
  function applyCapture(qx, qy, team) {
    if (G.W && G.W.terr) {
      const k = qy * SIM.GRID + qx;
      (G.W.terr[k] = G.W.terr[k] || { own: 0, p: {} }).own = team;
    }
    const F = SIM.FACTIONS[team];
    if (!F) return;
    G.quadIdx = -1;   // territory changed under our feet: refresh the label
    const ref = String.fromCharCode(65 + qx) + (qy + 1);
    say(F.name + ' captured quadrant ' + ref + '.', 'hsl(' + F.hue + ',85%,70%)');
    if (G.player && G.player.team === team) {
      const q = SIM.quadOf(G.player.x, G.player.y);
      if (q.qx === qx && q.qy === qy && G.mmo) {
        G.credits += 150; saveMMO();
        banner('QUADRANT CAPTURED', '+150 credits — held ground recharges your squad', 3);
      } else banner('QUADRANT ' + ref + ' TAKEN', 'your squad expands', 2.2);
    }
  }

  // seeded jaggy asteroid outline, baked once per rock
  function rockPath(rk) {
    if (rk._pts) return rk._pts;
    const rr = SIM.mulberry32(rk.shape);
    const n = 9 + ((rr() * 4) | 0);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, k = 0.72 + rr() * 0.35;
      pts.push([Math.cos(a) * rk.rad * k, Math.sin(a) * rk.rad * k]);
    }
    rk._pts = pts;
    return pts;
  }
  function blinkFX(x0, y0, x1, y1, hue) {
    G.waves.push({ x: x0, y: y0, r: 4, maxR: 55, t: 0, dur: 0.3, hue });
    G.waves.push({ x: x1, y: y1, r: 30, maxR: 6, t: 0, dur: 0.3, hue });
    puff(x0, y0, hue, 8, 90, 10);
    puff(x1, y1, hue, 8, 90, 10);
    // streak of afterimages along the jump
    for (let i = 0; i < 6; i++) {
      const t = i / 6;
      G.parts.push({
        x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t,
        vx: 0, vy: 0, life: 0.25 + t * 0.1, max: 0.35, hue, kind: 'flash', size: 26,
      });
    }
    sndBlink(x1, y1);
  }

  function boomFX(x, y, r, hue, big) {
    spark(x, y, hue, big ? 24 : 12, big ? 380 : 260);
    puff(x, y, 25, big ? 12 : 6, 120, big ? 26 : 14);
    debris(x, y, hue, big ? 10 : 5);
    flash(x, y, big ? 130 : 70, 40);
    G.waves.push({ x, y, r: 8, maxR: r * 1.5, t: 0, dur: 0.45, hue: 30 });
    G.waves.push({ x, y, r: 4, maxR: r * 0.9, t: 0, dur: 0.3, hue: 55 });
    if (G.player) {
      const d = hyp(x - G.player.x, y - G.player.y);
      if (d < 700) G.shake = Math.min(18, G.shake + (big ? 12 : 6) * (1 - d / 700));
    }
    sndBoom(x, y, big);
  }

  // ---------------------------------------------------------------- sim events -> fx/sfx/net
  function handleEvents(events) {
    const W = G.W;
    for (const e of events) {
      const mine = G.player && e.id === G.player.id;
      // violence near the player heats the music up
      if (G.player && !G.player.dead && e.x != null &&
          (e.e === 'hit' || e.e === 'kill' || e.e === 'boom')) {
        const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
        if (d < 1000) MUS.pulse = Math.min(1, MUS.pulse + (e.e === 'kill' ? 0.35 : 0.08));
      }
      switch (e.e) {
        case 'gun':
          sndShoot(e.x, e.y, e.level);
          flash(e.shots[0].x, e.shots[0].y, 26, 50);
          if (mine && G.online) netSend({ t: 'fire', kind: 'gun', shots: e.shots, level: e.level, dmg: e.dmg, bounces: e.bounces });
          break;
        case 'bomb':
          sndBomb(e.x, e.y);
          flash(e.x, e.y, 30, BOMB_HUES[e.level] || 4);
          if (mine && G.online) netSend({ t: 'fire', kind: 'bomb', x: e.x, y: e.y, vx: e.vx, vy: e.vy, level: e.level, bounces: e.bounces, prox: e.prox });
          break;
        case 'blink': {
          blinkFX(e.x0, e.y0, e.x1, e.y1, e.hue);
          if (mine && G.online) netSend({ t: 'fire', kind: 'blink', x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, hue: e.hue });
          break;
        }
        case 'warp': {
          blinkFX(e.x0, e.y0, e.x1, e.y1, e.hue);
          if (mine) say('Warped to your Comet', '#8df');
          if (mine && G.online) netSend({ t: 'fire', kind: 'warp', x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, hue: e.hue });
          break;
        }
        case 'burst': {
          G.waves.push({ x: e.x, y: e.y, r: 6, maxR: 90, t: 0, dur: 0.25, hue: 60 });
          sndBoom(e.x, e.y, false);
          if (mine && G.online) netSend({ t: 'fire', kind: 'burst', x: e.x, y: e.y, vx: e.vx, vy: e.vy, radius: e.radius });
          break;
        }
        case 'repel':
          G.waves.push({ x: e.x, y: e.y, r: 10, maxR: 230, t: 0, dur: 0.35, hue: 200 });
          sndRepel(e.x, e.y);
          if (mine && G.online) netSend({ t: 'fire', kind: 'repel', x: e.x, y: e.y });
          break;
        case 'rocket':
          if (mine) sndRocket();
          break;
        case 'hit': {
          spark(e.x, e.y, e.hue, 6, 220);
          if (G.player && e.att === G.player.id && e.id !== G.player.id) sndHitTick();
          if (mine) {
            G.shake = Math.min(16, G.shake + e.dmg / 55);
            G.hitFlash = Math.min(0.5, G.hitFlash + e.dmg / 1600);
            // report the hit: server credits attacker accuracy + reaper leech
            if (G.online) {
              const att = W.byId.get(e.att);
              if (att && att.remote) netSend({ t: 'dmg', att: e.att, amount: Math.round(e.dmg) });
            }
          }
          break;
        }
        case 'bhit':
          spark(e.x, e.y, 45, 4, 150);
          break;
        case 'shipBounce':
          sndBounce(e.x, e.y);
          break;
        case 'rockhit':
          sndRock(e.x, e.y);
          spark(e.x, e.y, 25, 10, 240);
          if (mine) {
            G.shake = Math.max(G.shake, 8);
            G.hitFlash = Math.max(G.hitFlash, 0.3);
            MUS.pulse = Math.min(1, MUS.pulse + 0.2);
          }
          break;
        case 'worm':
          blinkFX(e.x0, e.y0, e.x1, e.y1, 275);
          sndWorm(e.x0, e.y0);
          if (mine) {
            G.inStorm = true;   // suppress the arrival banner — this one's better
            banner('THE MAELSTROM', 'a wormhole swallowed you — the rim gate leads home', 3);
            MUS.pulse = 1;
            // tell the zone: without this relay, other clients lerp our
            // ghost across the whole 20km jump instead of showing the warp
            if (G.online) netSend({ t: 'fire', kind: 'worm', x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, hue: e.hue });
          }
          break;
        case 'capture':
          applyCapture(e.qx, e.qy, e.team);
          break;
        case 'relic':
          spark(e.x, e.y, 285, 14, 200);
          if (mine) {
            G.relics++; saveMMO();
            say('◆ Relic salvaged — rare tech for the upgrade bay (' + G.relics + ')', '#d9f');
            sndPrize(); tone('sine', 1320, 1980, 0.25, 0.12, 0.1);
            if (G.online) netSend({ t: 'relic', slot: e.slot });
          }
          break;
        case 'novahit':
          if (mine) {
            G.shake = Math.max(G.shake, 16);
            G.hitFlash = Math.max(G.hitFlash, 0.5);
            sndBomb(e.x, e.y);
            MUS.pulse = 1;
          }
          break;
        case 'raider':
          say('A marauder pack warps in — kill them for their bounty.', '#f96');
          break;
        case 'boom':
          boomFX(e.x, e.y, 70 + 28 * e.level, 25, e.level >= 2);
          break;
        case 'kill': {
          boomFX(e.x, e.y, 95, e.hue, true);
          if (e.kName && e.killer !== e.victim) say(e.vName + ' killed by: ' + e.kName + ' (' + e.bounty + ')', '#8f8');
          else if (!e.killer) say(e.vName + ' was torn apart by the maelstrom', '#f96');
          else say(e.vName + ' self-destructed', '#f88');
          // streak callouts keep the room aware of who's dangerous
          if (e.kStreak === 3) say(e.kName + ' is heating up (3)', '#fb6');
          else if (e.kStreak === 5) say(e.kName + ' is on a rampage! (5)', '#f96');
          else if (e.kStreak >= 8 && (e.kStreak - 8) % 3 === 0) say(e.kName + ' is UNSTOPPABLE (' + e.kStreak + ')', '#f66');
          if (G.player && e.victim === G.player.id) {
            G.deathBy = e.kName && e.killer !== e.victim ? e.kName : (e.killer ? 'their own bomb' : 'the maelstrom');
            G.lastKillerId = e.killer;
            G.combo = 0;
            G.best = Math.max(G.best, G.player.score);
            saveBest();
            if (G.online) netSend({ t: 'death', killer: e.killer, bounty: e.bounty });
          }
          if (G.player && e.killer === G.player.id && e.victim !== e.killer) {
            sndKill();
            if (G.time - G.lastKillT < 4.5) G.combo++; else G.combo = 1;
            G.lastKillT = G.time;
            if (G.combo === 2) banner('DOUBLE KILL', '');
            else if (G.combo === 3) banner('TRIPLE KILL', '');
            else if (G.combo >= 4) banner('KILLING FRENZY', G.combo + ' in a row');
            G.best = Math.max(G.best, G.player.score);
            saveBest();
            if (G.mmo) {
              const c = 30 + (e.bounty | 0);
              G.credits += c; saveMMO();
              say('+' + c + ' credits', '#fd8');
            }
          }
          matchScoreKill(e);
          break;
        }
        case 'green':
          if (mine && e.credit) {
            G.credits += 12; saveMMO();
            say('+12 credits (salvage)', '#fd8'); sndPrize();
          } else if (mine) { say('Green: ' + e.name, '#ff6'); sndPrize(); }
          break;
        case 'spawn':
          // upgrades survive death: reapply over the loadout reset
          if (G.player && e.id === G.player.id && G.mmo) {
            applyUpgrades(G.player);
            G.player.energy = G.player.maxEnergy;
          }
          break;
        case 'take':
          spark(e.x, e.y, 130, 8, 160);
          if (mine && G.online) netSend({ t: 'prize', id: e.prize });
          break;
        case 'restock':
          if (mine) say('Repel rack restocked', '#8df');
          break;
      }
    }
  }

  // ---------------------------------------------------------------- netcode
  function serverURL() {
    try {
      const q = new URLSearchParams(GLOBAL.location.search).get('server');
      // ?server= points the client at an arbitrary zone that then drives
      // every string in the UI — require an explicit confirm before trusting
      // a cross-origin target from a link someone else may have crafted
      if (q) {
        const url = q.startsWith('ws') ? q : 'ws://' + q;
        let host = '';
        try { host = new URL(url.replace(/^ws/, 'http')).host; } catch (e) { }
        if (host && host !== GLOBAL.location.host && !G._serverOk) {
          let ok = false;
          try { ok = GLOBAL.confirm && GLOBAL.confirm('Connect to a third-party zone server?\n\n' + host + '\n\nOnly do this if you trust it.'); } catch (e) { }
          if (!ok) { /* fall through to same-origin/default */ }
          else { G._serverOk = true; return url; }
        } else if (host) return url;
      }
      if (GLOBAL.location.protocol.startsWith('http')) {
        return (GLOBAL.location.protocol === 'https:' ? 'wss://' : 'ws://') + GLOBAL.location.host;
      }
    } catch (e) { }
    return 'ws://localhost:8666';
  }
  function netSend(obj) {
    if (G.net && G.net.readyState === 1) G.net.send(JSON.stringify(obj));
  }
  const nowSec = () => (GLOBAL.performance ? GLOBAL.performance.now() : Date.now()) / 1000;
  function fetchZoneStatus() {
    G.zoneStatus = null;
    try {
      const url = serverURL().replace(/^ws/, 'http') + '/status';
      GLOBAL.fetch(url).then(r => r.json())
        .then(j => { G.zoneStatus = j; })
        .catch(() => { G.zoneStatus = { err: 1 }; });
    } catch (e) { G.zoneStatus = { err: 1 }; }
  }
  function netConnect() {
    G.state = 'connecting';
    G.netErr = '';
    let ws;
    try { ws = new GLOBAL.WebSocket(serverURL()); }
    catch (e) { G.netErr = String(e.message || e); G.state = 'error'; return; }
    ws.binaryType = 'arraybuffer';
    G.net = ws;
    ws.onopen = () => {
      G.state = 'select';
      G.online = true;
    };
    ws.onerror = () => { };
    ws.onclose = () => {
      if (G.state === 'connecting') { G.netErr = 'Could not reach ' + serverURL(); G.state = 'error'; }
      else if (G.online) {
        G.online = false; G.net = null;
        if (G.state === 'play') { say('DISCONNECTED from server', '#f66'); }
        leaveToTitle();
      }
    };
    ws.onmessage = m => {
      if (typeof m.data !== 'string') { handleBinary(m.data); return; }
      let msg;
      try { msg = JSON.parse(m.data); } catch (e) { return; }
      handleNet(msg);
    };
  }
  // binary S2C states: u8 tag=2, f64 serverMs, u16 count, 24B/ship
  function handleBinary(data) {
    const W = G.W;
    if (!W) return;
    const dv = new DataView(data);
    if (dv.byteLength < 11 || dv.getUint8(0) !== 2) return;
    const count = dv.getUint16(9, true);
    const rt = nowSec();
    let off = 11;
    for (let i = 0; i < count && off + 26 <= dv.byteLength; i++, off += 26) {
      const id = dv.getUint32(off, true);
      const s = W.byId.get(id);
      if (!s || !s.remote) continue;
      const x = dv.getFloat32(off + 4, true), y = dv.getFloat32(off + 8, true);
      const vx = dv.getFloat32(off + 12, true), vy = dv.getFloat32(off + 16, true);
      const a = dv.getFloat32(off + 20, true);
      const flags = dv.getUint8(off + 24);
      const frac = dv.getUint8(off + 25) / 255;
      const dead = !!(flags & 1), th = (flags >> 1) & 1;
      if (s.dead && !dead) { s.snaps = []; s.safe = 2; s.x = x; s.y = y; }
      s.dead = dead;
      s.netX = x; s.netY = y; s.netVx = vx; s.netVy = vy; s.netA = a; s.netT = 0;
      if (!s.snaps) s.snaps = [];
      // a teleport (wormhole, gate, warp) must SNAP the ghost, not sweep
      // its interpolated hull across 20km of space
      const lastSnap = s.snaps[s.snaps.length - 1];
      if (lastSnap && hyp(x - lastSnap.x, y - lastSnap.y) > 2200) {
        s.snaps.length = 0;
        s.x = x; s.y = y;
      }
      s.snaps.push({ rt, x, y, vx, vy, a, th, frac, dead });
      if (s.snaps.length > 24) s.snaps.shift();
    }
  }
  // binary C2S state: u8 tag=1, f32 x,y,vx,vy,angle, u8 flags, u8 frac
  const stateBuf = typeof ArrayBuffer !== 'undefined' ? new ArrayBuffer(23) : null;
  function sendStateBin() {
    const p = G.player;
    if (!p || !stateBuf || !G.net || G.net.readyState !== 1) return;
    const dv = new DataView(stateBuf);
    dv.setUint8(0, 1);
    dv.setFloat32(1, p.x, true);
    dv.setFloat32(5, p.y, true);
    dv.setFloat32(9, p.vx, true);
    dv.setFloat32(13, p.vy, true);
    dv.setFloat32(17, p.angle, true);
    dv.setUint8(21, (p.dead ? 1 : 0) | ((p.ctl.thrust > 0 || p.rocketT > 0 ? 1 : 0) << 1));
    dv.setUint8(22, Math.round(clamp(p.energy / p.maxEnergy, 0, 1) * 255));
    try { G.net.send(stateBuf); } catch (e) { }
  }
  function rosterAdd(r) {
    const W = G.W;
    if (W.byId.get(r.id)) return;
    const s = SIM.makeShip(W, r.ship, 'remote', r.name, r.hue, r.team || 0);
    // server owns the id space online
    W.byId.delete(s.id);
    s.id = r.id;
    W.byId.set(s.id, s);
    W.nextId = Math.max(W.nextId, r.id + 1);
    s.kills = r.kills || 0; s.deaths = r.deaths || 0; s.score = r.score || 0;
    s.elo = r.elo || 0;
    s.dead = !!r.dead;
    s.x = s.netX = r.x || WORLD / 2;
    s.y = s.netY = r.y || WORLD / 2;
  }
  function handleNet(msg) {
    const W = G.W;
    switch (msg.t) {
      case 'welcome': {
        G.myId = msg.id;
        G.contacts.clear(); G.contactFx.length = 0;
        G.evtSeen = -1; G.quadIdx = -1; G.board = null;
        const team = msg.team || 0;
        G.zoneMode = msg.mode || 'teams';
        G.sideFlip = msg.flip || 0;
        G.myElo = msg.me ? msg.me.elo : 0;
        // rebuild world from the server's seed so maps match
        const opts = {
          seed: msg.seed, spawnPrizes: false, mapStyle: msg.style || 'nexus',
          ghostInterp: true, now: nowSec,
        };
        if (team) {
          const C = WORLD / 2;
          opts.respawnDelay = 2.2;
          opts.spawnPoint = sh => {
            if (!sh.team) return null;
            const side = G.sideFlip ? 3 - sh.team : sh.team;
            return {
              x: (side === 1 ? C - 950 : C + 950) + SIM.rand(-260, 260),
              y: C + SIM.rand(-320, 320),
              angle: side === 1 ? 0 : Math.PI,
            };
          };
        }
        G.W = SIM.createWorld(opts);
        G.W.time = msg.wt || 0;   // maelstrom rocks are a function of world time
        prerenderMap();
        for (const r of msg.roster) rosterAdd(r);
        for (const p of msg.prizes) SIM.addPrize(G.W, p[1], p[2], p[0]);
        // now create OUR ship with the server-issued id
        const me = SIM.makeShip(G.W, G.pendingShip, 'local', G.name, msg.hue, team);
        me.elo = G.myElo;
        G.W.byId.delete(me.id);
        me.id = msg.id;
        G.W.byId.set(me.id, me);
        G.W.nextId = Math.max(G.W.nextId, msg.id + 1);
        SIM.spawnShip(G.W, me);
        G.player = me;
        // online is the MMO layer too: salvage economy + upgrades
        G.mmo = true;
        me.noGreens = true;
        applyUpgrades(me);
        me.energy = me.maxEnergy;
        G.quad = quadName(me.x, me.y);
        SIM.drainEvents(G.W);
        G.mode = team ? 'online-teams' : 'online-ffa';
        const isCore = G.zoneMode === 'core';
        G.match = team ? {
          mode: isCore ? 'core' : 'online', online: true, target: msg.goal || 30,
          a: (isCore ? msg.ca : msg.ta) || 0, b: (isCore ? msg.cb : msg.tb) || 0, over: false,
        } : null;
        G.state = 'play';
        say('Connected — welcome to the zone, ' + G.name + ' (elo ' + G.myElo + ').', '#8df');
        if (team) say('You fly for ' + (team === 1 ? 'BLUE' : 'RED') + ' — ' +
          (isCore ? 'hold the core ring to score, first to ' : 'first to ') + (msg.goal || 30) +
          '. Chat: // team · /duel <name> · /help', team === 1 ? '#8cf' : '#f98');
        say('ENTER to chat. Fly dangerous.', '#8df');
        break;
      }
      case 'join':
        rosterAdd(msg.p);
        say(msg.p.name + ' entered the zone', '#8df');
        break;
      case 'leave': {
        const s = W && W.byId.get(msg.id);
        if (s) { SIM.removeShip(W, s); say(s.name + ' left the zone', '#89a'); }
        break;
      }
      case 'states':
        if (!W) break;
        for (const st of msg.s) {
          const s = W.byId.get(st[0]);
          if (!s || !s.remote) continue;
          s.netX = st[1]; s.netY = st[2]; s.netVx = st[3]; s.netVy = st[4];
          s.netA = st[5]; s.netT = 0;
          const wasDead = s.dead;
          s.dead = !!st[6];
          if (wasDead && !s.dead) { s.safe = 2; s.x = s.netX; s.y = s.netY; }
          s.netFrac = st[7]; s.netTh = st[8];
        }
        break;
      case 'fire': {
        const o = W && W.byId.get(msg.id);
        if (!o) break;
        if (msg.kind === 'gun') { SIM.injectGun(W, o, msg); sndShoot(o.x, o.y, msg.level); }
        else if (msg.kind === 'bomb') { SIM.injectBomb(W, o, msg); sndBomb(msg.x, msg.y); }
        else if (msg.kind === 'burst') { SIM.injectBurst(W, o, msg); G.waves.push({ x: msg.x, y: msg.y, r: 6, maxR: 90, t: 0, dur: 0.25, hue: 60 }); }
        else if (msg.kind === 'repel') { SIM.injectRepel(W, o, msg); G.waves.push({ x: msg.x, y: msg.y, r: 10, maxR: 230, t: 0, dur: 0.35, hue: 200 }); sndRepel(msg.x, msg.y); }
        else if (msg.kind === 'blink') { blinkFX(msg.x0, msg.y0, msg.x1, msg.y1, msg.hue || o.hue); }
        else if (msg.kind === 'warp') { blinkFX(msg.x0, msg.y0, msg.x1, msg.y1, msg.hue || o.hue); }
        else if (msg.kind === 'worm') { blinkFX(msg.x0, msg.y0, msg.x1, msg.y1, 275); sndWorm(msg.x0, msg.y0); }
        break;
      }
      case 'leech': {
        if (G.player && !G.player.dead) {
          const amt = Math.min(600, Math.max(0, +msg.amount || 0));
          G.player.energy = Math.min(G.player.maxEnergy, G.player.energy + amt);
          spark(G.player.x, G.player.y, 275, 4, 120);
        }
        break;
      }
      case 'death': {
        const v = W && W.byId.get(msg.id);
        const k = W && W.byId.get(msg.killer);
        if (v) {
          v.dead = true;
          boomFX(v.x, v.y, 95, v.hue, true);
          if (k && msg.killer !== msg.id) say(v.name + ' killed by: ' + (k ? k.name : '?') + ' (' + msg.bounty + ')', '#8f8');
          else if (!msg.killer) say(v.name + ' was torn apart by the maelstrom', '#f96');
          else say(v.name + ' self-destructed', '#f88');
        }
        // remote deaths never flow through the local sim's kill event, so
        // the kill feel + economy must fire here too
        if (G.player && msg.killer === G.player.id && msg.id !== G.player.id) {
          sndKill();
          if (G.time - G.lastKillT < 4.5) G.combo++; else G.combo = 1;
          G.lastKillT = G.time;
          if (G.combo === 2) banner('DOUBLE KILL', '');
          else if (G.combo === 3) banner('TRIPLE KILL', '');
          else if (G.combo >= 4) banner('KILLING FRENZY', G.combo + ' in a row');
          if (G.mmo) {
            const c = 30 + (Math.max(0, msg.bounty | 0));
            G.credits += c; saveMMO();
            say('+' + c + ' credits', '#fd8');
          }
        }
        break;
      }
      case 'score': {
        const s = W && W.byId.get(msg.id);
        if (s) { s.kills = msg.kills; s.deaths = msg.deaths; s.score = msg.score; }
        if (G.player && msg.id === G.player.id) {
          G.best = Math.max(G.best, msg.score);
        }
        break;
      }
      case 'clock':
        // re-align the world clock so everyone's storm rocks fly in step
        if (W && Math.abs(W.time - msg.wt) > 0.75) W.time = msg.wt;
        break;
      case 'terr':
        applyCapture(msg.qx, msg.qy, msg.team);
        break;
      case 'relic-':
        if (W && W.relicSlots && W.relicSlots[msg.i]) W.relicSlots[msg.i].taken = W.time;
        break;
      case 'prize+':
        if (W) SIM.addPrize(W, msg.x, msg.y, msg.id);
        break;
      case 'prize-':
        if (W) SIM.removePrizeById(W, msg.id);
        break;
      case 'chat': {
        if (msg.id === 0) { say('» ' + msg.text, '#fd8'); sndChat(); break; }
        say((msg.tc ? 'T· ' : '') + msg.name + '> ' + msg.text, msg.tc ? '#8fd4a8' : '#9cf');
        sndChat();
        break;
      }
      case 'tscore': {
        if (G.match && G.match.online && G.match.mode !== 'core') { G.match.a = msg.a; G.match.b = msg.b; }
        break;
      }
      case 'core': {
        G.coreOwner = msg.o || 0;
        if (G.match && G.match.online && G.match.mode === 'core') { G.match.a = msg.a; G.match.b = msg.b; }
        break;
      }
      case 'round': {
        const won = msg.winner === myTeam();
        banner(won ? 'ROUND WON' : 'ROUND LOST',
          'MVP: ' + (msg.mvp || '—') + ' (' + (msg.mvpK || 0) + ')  ·  sides swap', 6);
        if (won) sndWin(); else sndLose();
        G.sideFlip = msg.flip || 0;
        if (G.match && G.match.online) { G.match.a = 0; G.match.b = 0; }
        G.coreOwner = 0;
        break;
      }
      case 'duelstart': {
        const p = G.player;
        if (p) {
          p.x = msg.x; p.y = msg.y; p.vx = 0; p.vy = 0;
          p.angle = msg.angle;
          p.energy = p.maxEnergy;
          p.safe = 1.5;
          if (p.dead) { p.dead = false; }
        }
        G.duel = { opp: msg.opp, name: msg.oppName, a: 0, b: 0, target: msg.target, mine: 0, theirs: 0 };
        banner('DUEL vs ' + msg.oppName, 'first to ' + msg.target + ' — center arena', 3.5);
        break;
      }
      case 'duelscore': {
        if (G.duel) { G.duel.mine = msg.mine; G.duel.theirs = msg.theirs; }
        break;
      }
      case 'duelend': {
        banner(msg.won ? 'DUEL VICTORY' : 'DUEL LOST',
          'elo ' + msg.elo + ' (' + (msg.won ? '+' : '−') + msg.delta + ')', 5);
        if (msg.won) sndWin(); else sndLose();
        if (G.player) G.player.elo = msg.elo;
        G.myElo = msg.elo;
        G.duel = null;
        break;
      }
      case 'elo': {
        const s = W && W.byId.get(msg.id);
        if (s) s.elo = msg.elo;
        break;
      }
      case 'newmap': {
        if (!W) break;
        G.evtSeen = -1; G.quadIdx = -1; G.board = null;
        const oldShips = W.ships.slice();
        const opts = Object.assign({}, W.opts, { seed: msg.seed, mapStyle: msg.style });
        G.W = SIM.createWorld(opts);
        for (const s of oldShips) {
          G.W.ships.push(s);
          G.W.byId.set(s.id, s);
          G.W.nextId = Math.max(G.W.nextId, s.id + 1);
          s.snaps = [];
        }
        prerenderMap();
        if (msg.prizes) for (const p of msg.prizes) SIM.addPrize(G.W, p[1], p[2], p[0]);
        if (G.player) SIM.spawnShip(G.W, G.player);
        SIM.drainEvents(G.W);
        say('Warped to a new ' + msg.style + ' sector', '#fd8');
        break;
      }
    }
  }

  // ---------------------------------------------------------------- world setup
  function newSoloWorld() {
    G.W = SIM.createWorld({ seed: (Math.random() * 1e9) | 0, spawnPrizes: true, zoneWorld: true, authority: true });
    // squad members respawn in their fortress keep, under the mothership;
    // freelancers respawn in the contested mid-sector
    G.W.opts.spawnPoint = sh => {
      const ms = sh.team && G.W.motherships ? G.W.motherships[sh.team] : null;
      if (!ms) return null;
      const a = Math.random() * Math.PI * 2;
      return {
        x: ms.x + Math.cos(a) * 230, y: ms.y + Math.sin(a) * 230,
        angle: Math.atan2(WORLD / 2 - ms.y, WORLD / 2 - ms.x),
      };
    };
    prerenderMap();
    // the four squads wage their war with or without you
    const bots = SIM.addBots(G.W, 20);
    bots.forEach((b, i) => { b.team = [1, 2, 3, 4, 0][i % 5]; });
    for (let i = 0; i < 60; i++) {
      const p = SIM.randClearPoint(G.W);
      SIM.addPrize(G.W, p.x, p.y);
    }
    SIM.drainEvents(G.W);
  }

  // The sector is far too big to prerender as one canvas (8192px square would
  // be a quarter-gigabyte of pixels), so the map bakes lazily in 512px chunks
  // as the camera reaches them, with an LRU cache. Baking a chunk is a couple
  // of milliseconds once; drawing a baked chunk is one drawImage.
  const CHUNK_T = 32;                 // tiles per chunk edge
  const CHUNK_PX = CHUNK_T * TILE;    // 512px
  const NCHUNK = Math.ceil(MAPS / CHUNK_T);
  const CHUNK_CACHE = 60;             // ~60MB worst case, far less in practice

  function prerenderMap() {
    const W = G.W;
    const doc = GLOBAL.document;
    G.mapChunks = new Map();          // invalidates every baked chunk

    // no radar prerender: the endless world's scanner samples the sparse
    // tile field live, drawing only its local window each frame
  }

  function mapChunk(chx, chy) {
    const key = chy * NCHUNK + chx;
    let ch = G.mapChunks.get(key);
    if (ch !== undefined) {
      // re-insert so Map order tracks recency and eviction is LRU
      // (null is a cached EMPTY sentinel — most of space is empty)
      G.mapChunks.delete(key); G.mapChunks.set(key, ch);
      return ch;
    }
    ch = bakeChunk(chx, chy);
    G.mapChunks.set(key, ch);
    if (G.mapChunks.size > CHUNK_CACHE) {
      const oldest = G.mapChunks.keys().next().value;
      G.mapChunks.delete(oldest);
    }
    return ch;
  }

  function bakeChunk(chx, chy) {
    const W = G.W;
    const doc = GLOBAL.document;
    // include a one-tile border ring so neighbours' glow bleeds in correctly
    const tx0 = Math.max(0, chx * CHUNK_T - 1), ty0 = Math.max(0, chy * CHUNK_T - 1);
    const tx1 = Math.min(MAPS, (chx + 1) * CHUNK_T + 1), ty1 = Math.min(MAPS, (chy + 1) * CHUNK_T + 1);
    // ~99.5% of space is empty: an all-empty chunk gets NO canvas at all
    // (a 512px transparent canvas is 1MB of pixels and a wasted blit)
    let any = false;
    outer: for (let ty = ty0; ty < ty1; ty++)
      for (let tx = tx0; tx < tx1; tx++)
        if (SIM.tileSolid(W, tx, ty)) { any = true; break outer; }
    if (!any) return null;
    const cnv = doc.createElement('canvas');
    cnv.width = CHUNK_PX; cnv.height = CHUNK_PX;
    const c = cnv.getContext('2d');
    c.translate(-chx * CHUNK_PX, -chy * CHUNK_PX);
    // Solid, chunky, bevelled tiles — the original's maps were rock and
    // steel, not wireframes. Deterministic per-tile hash varies the tone.
    const hash = (x, y) => {
      let h = (x * 374761393 + y * 668265263) | 0;
      h = (h ^ (h >> 13)) * 1274126177 | 0;
      return ((h ^ (h >> 16)) >>> 0) / 4294967296;
    };
    // outer glow bleed: the collidable layer announces itself against space.
    // ONE path + ONE shadowed fill — per-tile shadow fills hang Firefox.
    c.save();
    c.shadowColor = 'rgba(90,145,255,0.55)';
    c.shadowBlur = 11;
    c.fillStyle = '#161e34';
    c.beginPath();
    for (let ty = ty0; ty < ty1; ty++)
      for (let tx = tx0; tx < tx1; tx++)
        if (SIM.tileSolid(W, tx, ty)) c.rect(tx * TILE, ty * TILE, TILE, TILE);
    c.fill();
    c.restore();
    for (let ty = ty0; ty < ty1; ty++) {
      for (let tx = tx0; tx < tx1; tx++) {
        if (!SIM.tileSolid(W, tx, ty)) continue;
        const x = tx * TILE, y = ty * TILE;
        const h0 = hash(tx, ty);
        const lit = 20 + h0 * 7;                       // per-tile tonal variation
        const hue = 222 + (hash(tx + 7, ty + 3) - 0.5) * 14;
        c.fillStyle = 'hsl(' + hue + ',26%,' + lit + '%)';
        c.fillRect(x, y, TILE, TILE);
        // classic bevel: light top/left, dark bottom/right
        const openU = !SIM.tileSolid(W, tx, ty - 1), openD = !SIM.tileSolid(W, tx, ty + 1);
        const openL = !SIM.tileSolid(W, tx - 1, ty), openR = !SIM.tileSolid(W, tx + 1, ty);
        c.fillStyle = 'hsla(' + hue + ',30%,' + (lit + 22) + '%,' + (openU ? 0.9 : 0.25) + ')';
        c.fillRect(x, y, TILE, 2);
        c.fillStyle = 'hsla(' + hue + ',30%,' + (lit + 18) + '%,' + (openL ? 0.8 : 0.2) + ')';
        c.fillRect(x, y, 2, TILE);
        c.fillStyle = 'rgba(2,4,10,' + (openD ? 0.75 : 0.3) + ')';
        c.fillRect(x, y + TILE - 2, TILE, 2);
        c.fillStyle = 'rgba(2,4,10,' + (openR ? 0.65 : 0.25) + ')';
        c.fillRect(x + TILE - 2, y, 2, TILE);
        // speckled rock texture
        for (let k = 0; k < 4; k++) {
          const sx = x + 2 + hash(tx * 5 + k, ty * 9 + k) * (TILE - 5);
          const sy = y + 2 + hash(tx * 11 + k, ty * 3 + k) * (TILE - 5);
          c.fillStyle = hash(tx + k, ty - k) > 0.5 ? 'rgba(0,0,8,0.28)' : 'rgba(160,190,255,0.08)';
          c.fillRect(sx, sy, 1.6, 1.6);
        }
        // thin energized rim only where the wall faces open space
        c.strokeStyle = 'rgba(140,185,255,0.6)';
        c.lineWidth = 1;
        c.beginPath();
        if (openU) { c.moveTo(x, y + 0.5); c.lineTo(x + TILE, y + 0.5); }
        if (openD) { c.moveTo(x, y + TILE - 0.5); c.lineTo(x + TILE, y + TILE - 0.5); }
        if (openL) { c.moveTo(x + 0.5, y); c.lineTo(x + 0.5, y + TILE); }
        if (openR) { c.moveTo(x + TILE - 0.5, y); c.lineTo(x + TILE - 0.5, y + TILE); }
